<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IIIF test - Mirador</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <style>
    html, body, #mirador { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="mirador"></div>
  <script src="https://unpkg.com/mirador@3.3.0/dist/mirador.min.js"></script>
  <script>
    // dev-only page: verifies the static IIIF package in a stock 2D viewer.
    // Usage: /examples/iiif-test/?manifest=<url>  (default: moss, local)
    const param = new URLSearchParams(location.search).get('manifest')
      || '../../moss/iiif/manifest.json';
    const manifestId = new URL(param, location.href).href;
    Mirador.viewer({
      id: 'mirador',
      windows: [{ manifestId }],
      window: { allowClose: false, defaultSideBarPanel: 'info' },
    });
  </script>
</body>
</html>
